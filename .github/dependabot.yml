version: 2
# Monthly and grouped: every Dependabot PR runs full CI, and a weekly batch of
# single-package PRs meant a lot of CI runs and reviews for small bumps.
# Security updates are separate from this schedule and still open immediately.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # Majors stay one PR each since they usually need code changes.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # Base-image runtime upgrades are deliberate (and Dependabot happily
    # proposes end-of-life odd-numbered Node releases), so only allow bumps
    # within the current runtime line.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
