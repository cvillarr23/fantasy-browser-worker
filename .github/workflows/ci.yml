name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test

  build-and-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cvillarr23/fantasy-browser-worker:latest
            ghcr.io/cvillarr23/fantasy-browser-worker:${{ github.sha }}
      - name: Verify pushed digest is pullable
        run: |
          docker buildx imagetools inspect \
            ghcr.io/cvillarr23/fantasy-browser-worker@${{ steps.build.outputs.digest }} >/dev/null

      - name: Publish digest evidence
        run: |
          {
            echo "### Published image"
            echo "- \`ghcr.io/cvillarr23/fantasy-browser-worker@${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Argo CD Image Updater (configured in fantasy-infra) should track this repository's \`latest\` tag"
            echo "with digest strategy and write back deterministic \`@sha256:...\` Kustomize updates to \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"
