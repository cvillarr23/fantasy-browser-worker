name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: fantasy-runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: fantasy-runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test

  build-and-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: fantasy-runners
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cvillarr23/fantasy-browser-worker:latest
            ghcr.io/cvillarr23/fantasy-browser-worker:${{ github.sha }}
      - name: Verify pushed digest is pullable
        run: |
          docker buildx imagetools inspect \
            ghcr.io/cvillarr23/fantasy-browser-worker@${{ steps.build.outputs.digest }} >/dev/null

      - name: Publish digest evidence
        run: |
          {
            echo "### Published image"
            echo "- \`ghcr.io/cvillarr23/fantasy-browser-worker@${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Argo CD Image Updater (configured in fantasy-infra) should track this repository's \`latest\` tag"
            echo "with digest strategy and write back deterministic \`@sha256:...\` Kustomize updates to \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"
