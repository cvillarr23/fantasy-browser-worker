# Manual test Job for draft_sync.js — NOT part of fantasy-infra's GitOps-synced tree, so it never
# auto-deploys via Argo CD. Apply/delete this by hand whenever you want to test the pipeline
# end-to-end against a live ESPN mock draft.
#
# Pulls from GHCR (.github/workflows/ci.yml builds+pushes on every push to main) rather than a
# locally-built image — the repo is private, so the package stays private too, pulled via the
# ghcr-pull-secret ExternalSecret (fantasy-infra: overlays/production/externalsecrets.yaml).
# One-time setup, once for the whole cluster (not per test run):
#   bao kv put secret/fantasy/ghcr username=<your-github-username> token=<PAT with read:packages scope>
#
# DRAFT_ROOM_URL: join or create a mock draft yourself in a real, logged-in browser first
# (https://fantasy.espn.com/football/mockdraftlobby), then paste that room's URL below.
# DRAFT_MODE=mock (auto-join a fresh practice draft) does NOT currently work — ESPN's mock lobby
# has no anonymous instant-start option, and the closest thing to one ("League Specific Practice
# Draft") is gated by the same invisible reCAPTCHA Enterprise that blocks automated login.
# Confirmed via live debugging 2026-08-10 — see draft_sync.js's header comment.
#
# Usage:
#   git push origin main                                        # triggers the build+publish workflow
#   # edit DRAFT_ROOM_URL below to a room you joined yourself
#   kubectl delete job draft-sync-test --ignore-not-found -n default
#   kubectl apply -f k8s/test-draft-sync-job.yaml
#   kubectl logs -f job/draft-sync-test -n default
#
# In another terminal, to watch the picks land in Redis:
#   kubectl port-forward svc/fantasy-cache 6379:6379 -n default
#   node scripts/watch_draft_picks.js
#
# To watch the browser live via CDP (optional):
#   kubectl port-forward job/draft-sync-test 9222:9222 -n default
#   # then open chrome://inspect locally and add localhost:9222 as a target
apiVersion: batch/v1
kind: Job
metadata:
  name: draft-sync-test
  namespace: default
  labels:
    app: fantasy-browser-worker
    component: draft-sync-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: fantasy-browser-worker
        component: draft-sync-test
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: draft-sync
          image: ghcr.io/cvillarr23/fantasy-browser-worker:latest
          imagePullPolicy: Always # always pull latest for a test run, don't reuse a stale cached image
          command: ["node", "src/bots/draft_sync.js"]
          ports:
            - containerPort: 9222
              name: cdp-debug
          env:
            - name: DRAFT_ROOM_URL
              value: "https://fantasy.espn.com/football/draft?leagueId=294773976&seasonId=2026&teamId=8&memberId={74F98EAE-F0AD-4E1C-91DC-00EBA32AF50E}"
            - name: CDP_DEBUG_PORT
              value: "9222"
            - name: REDIS_HOST
              value: "fantasy-cache.default.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            # Sends OTel traces to homelab-deployment's Tempo instance -- see the matching env var
            # comment in fantasy-infra's keda-scaledjob.yaml for why this must be http://, not
            # grpc://.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.default.svc.cluster.local:4317"
            - name: ESPN_S2
              valueFrom:
                secretKeyRef:
                  name: espn-session-secrets
                  key: espn_s2
            - name: SWID
              valueFrom:
                secretKeyRef:
                  name: espn-session-secrets
                  key: swid
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1200Mi" # Same ceiling as the production ScaledJob — catches Chromium bloat here too
              cpu: "1000m"
